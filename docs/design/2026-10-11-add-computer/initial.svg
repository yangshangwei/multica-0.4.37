<svg xmlns="http://www.w3.org/2000/svg" width="736" height="490" viewBox="0 0 736 490">
<rect width="736" height="490" fill="#ededf0"/>
<rect x="48" y="28" width="640" height="364" rx="14" fill="white"/>
<text x="76" y="58" dominant-baseline="text-before-edge" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="600" fill="#18181b">添加电脑</text>
<polyline points="648,62 660,74" fill="none" stroke="#18181b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="660,62 648,74" fill="none" stroke="#18181b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="98" dominant-baseline="text-before-edge" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#62626e">选择目标电脑的系统，再到那台电脑上运行以下命令。</text>
<text x="76" y="145" dominant-baseline="text-before-edge" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="#18181b">目标电脑系统</text>
<rect x="76" y="171" width="584" height="44" rx="8" fill="#f4f4f5"/>
<text x="142.5" y="185" dominant-baseline="text-before-edge" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#62626e">Windows</text>
<text x="343.5" y="185" dominant-baseline="text-before-edge" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#62626e">macOS</text>
<text x="543.0" y="185" dominant-baseline="text-before-edge" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#62626e">Linux</text>
<text x="76" y="239" dominant-baseline="text-before-edge" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#62626e">请选择要添加的电脑系统。</text>
<text x="76" y="267" dominant-baseline="text-before-edge" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#62626e">安装与连接命令会显示在这里。</text>
<polyline points="48,322 688,322" fill="none" stroke="#e4e4e7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="349" dominant-baseline="text-before-edge" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#62626e">关闭窗口不会停止已连接的电脑。</text>
<rect x="588" y="340" width="72" height="34" rx="7" fill="white" stroke="#e4e4e7"/>
<text x="610.0" y="349" dominant-baseline="text-before-edge" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="600" fill="#18181b">关闭</text>
<text x="76" y="428" dominant-baseline="text-before-edge" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#62626e">初始状态 · 不预选目标电脑系统</text>
