# -----------------------------------------------------------------------------
# Container images
# -----------------------------------------------------------------------------
images:
  backend:
    repository: ghcr.io/multica-ai/multica-backend
    # Empty defaults to Chart.appVersion. Released OCI charts set appVersion to
    # the Git tag (for example v0.3.5), so installs use matching app images.
    tag: ""
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/multica-ai/multica-web
    # Empty defaults to Chart.appVersion. Set explicitly to override.
    tag: ""
    pullPolicy: IfNotPresent
  postgres:
    repository: pgvector/pgvector
    tag: pg17
    pullPolicy: IfNotPresent

# -----------------------------------------------------------------------------
# Pre-created Secret with sensitive values. Create it before `helm install`:
#
# Built-in postgres (default):
#   kubectl -n <namespace> create secret generic multica-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=RESEND_API_KEY="" \
#     --from-literal=GOOGLE_CLIENT_SECRET="" \
#     --from-literal=CLOUDFRONT_PRIVATE_KEY="" \
#     --from-literal=MULTICA_DEV_VERIFICATION_CODE=""
#
# External postgres (postgres.external.enabled=true):
#   Replace POSTGRES_PASSWORD with DATABASE_URL pointing at your external cluster.
#   kubectl -n <namespace> create secret generic multica-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=DATABASE_URL="postgres://user:pass@host:5432/multica?sslmode=require" \
#     --from-literal=RESEND_API_KEY="" \
#     --from-literal=GOOGLE_CLIENT_SECRET="" \
#     --from-literal=CLOUDFRONT_PRIVATE_KEY="" \
#     --from-literal=MULTICA_DEV_VERIFICATION_CODE=""
#
# The chart references this Secret by name; it does not template it, so real
# values never need to land in git.
# -----------------------------------------------------------------------------
existingSecret: multica-secrets

# -----------------------------------------------------------------------------
# PostgreSQL
# -----------------------------------------------------------------------------
postgres:
  # Set external.enabled=true to skip the built-in postgres Deployment/PVC and
  # supply DATABASE_URL directly via the existingSecret instead. When true,
  # the postgres Deployment, PVC, and Service are not created.
  # Add DATABASE_URL to your existingSecret pointing at the external cluster.
  external:
    enabled: false
  database: multica
  user: multica
  persistence:
    size: 10Gi
    # Leave empty to use the cluster's default StorageClass.
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Standard Kubernetes scheduling constraints for the postgres Deployment.
  affinity: {}
  tolerations: []

# -----------------------------------------------------------------------------
# Backend (Go API + WS server)
# -----------------------------------------------------------------------------
backend:
  changelog:
    # Optional existing claim containing changelog.json. Publish through a
    # writer pod, and use ReadWriteMany when sharing across backend replicas.
    # The whole directory is mounted so atomic file replacement stays visible.
    existingClaim: ""
  # Concurrent backend pods are now safe to start: cmd/migrate uses a
  # Postgres session-level advisory lock to serialize the startup
  # `migrate up` run, so late-arriving pods queue and then no-op (see
  # GitHub multica-ai/multica#3647). 1 is still the recommended default
  # because the chart Deployment uses strategy: Recreate and there is no
  # leader-elected workload split — increase this only if you actually
  # need horizontal scale of the API/WS server.
  replicas: 1
  uploads:
    persistence:
      # When true (default) the chart provisions a PersistentVolumeClaim for
      # /app/data/uploads and mounts it into the backend pod. The backend only
      # uses this directory when S3 is NOT configured (`backend.config.s3Bucket`
      # empty) — see server/cmd/server/router.go for the storage selection.
      #
      # Set to false when you have configured S3/CloudFront and don't want the
      # chart to declare the uploads PVC at all. The default access mode is
      # ReadWriteOnce, which prevents `backend.replicas > 1` from scheduling a
      # second pod (Multi-Attach error); disabling persistence — or switching
      # accessModes to a ReadWriteMany class — removes that constraint on the
      # storage side.
      enabled: true
      size: 5Gi
      # Leave empty to use the cluster's default StorageClass.
      storageClass: ""
      # PVC accessModes. Defaults to [ReadWriteOnce] to match the typical
      # local-path / hostPath / EBS StorageClass on a single-node setup. Switch
      # to [ReadWriteMany] (with a compatible StorageClass such as NFS, EFS,
      # CephFS) if you intend to share the uploads volume across multiple
      # backend replicas without S3.
      accessModes:
        - ReadWriteOnce
  # All non-secret backend env. Secret values come from `existingSecret`.
  config:
    # Empty uses the embedded history. For the claim above, set this to
    # /app/data/changelog/changelog.json to enable updates without a restart.
    changelogFile: ""
    # The migrator and API server retry transient PostgreSQL startup failures
    # within this budget. Set to 0 to restore fail-fast startup behavior.
    databaseStartupTimeout: 3m
    # Fallback bound for each PostgreSQL connection attempt during startup.
    # Native connect_timeout / PGCONNECT_TIMEOUT / service settings take
    # precedence so existing deployments keep their pgx connection behavior.
    databaseConnectTimeout: 5s
    appEnv: production
    appUrl: http://multica.dev.lan
    frontendOrigin: http://multica.dev.lan
    corsAllowedOrigins: ""
    cookieDomain: ""
    resendFromEmail: noreply@multica.ai
    allowSignup: true
    allowedEmails: ""
    allowedEmailDomains: ""
    # Self-host gate (#3433): set true to make POST /api/workspaces 403 for
    # every caller. Bootstrap the workspace with this false, then flip to
    # true so users can only join via invitation.
    disableWorkspaceCreation: false
    # Intranet device auth (ON by default for self-hosted). It means any client
    # that can reach the backend mints its own identity and never logs in - the
    # deployment has no authentication left. Read SELF_HOSTING.md "Intranet Mode
    # - No Login" first, and put the deployment behind a trusted network or set
    # enabled to "false".
    deviceAuth:
      # Empty takes the server default, which is ON for a self-hosted chart
      # install: read the paragraph above before leaving it that way. Set to
      # "false" to require the normal login page.
      enabled: ""
      # One shared workspace every device joins instead of onboarding into its
      # own. Empty - the default - sends every first launch through onboarding,
      # where the member names their own workspace. A named slug is created on
      # first use; an existing workspace with it is reused and never modified.
      workspaceSlug: ""
      # Display name, applied only when that workspace is created. Empty derives
      # it from the slug.
      workspaceName: ""
      # Role for every device after the first. admin or member; the device that
      # created the workspace becomes its owner. Only consulted when
      # workspaceSlug names a workspace.
      role: member
    # Set false on isolated networks to disable Lark, Slack, DingTalk, WeCom,
    # and Telegram connections/bindings and hide their UI. Git is independent.
    messagingIntegrationsEnabled: true
    # Self-host-only VCS integration (Forgejo / Gitea / GitLab). The official
    # chart enables the product surface by default; operators must also provide
    # MULTICA_VCS_SECRET_KEY through existingSecret before connections work.
    # Set false to hide and reject the integration for this deployment.
    vcsIntegrationEnabled: true
    # Managed multica-cloud connection. Empty keeps self-hosting independent.
    # Fleet, Billing, entitlement policy and strict seat capacity share it.
    cloud:
      url: ""
    googleClientId: ""
    googleRedirectUri: http://multica.dev.lan/auth/callback
    s3Bucket: ""
    s3Region: us-west-2
    cloudfrontDomain: ""
    cloudfrontKeyPairId: ""
    localUploadBaseUrl: http://api.multica.dev.lan
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Standard Kubernetes scheduling constraints for the backend Deployment.
  affinity: {}
  tolerations: []

# -----------------------------------------------------------------------------
# Frontend (Next.js standalone)
# -----------------------------------------------------------------------------
frontend:
  replicas: 1
  config:
    # Backend origin used by the frontend runtime proxy for /v1, /api, /auth,
    # /uploads, and /ws. Empty defaults to this release's backend Service.
    remoteApiUrl: ""
    # Optional docs origin used by the frontend runtime proxy for /docs.
    docsUrl: ""
    # Optional browser-visible split-origin overrides. Leave empty for the
    # default same-origin frontend proxy.
    publicApiUrl: ""
    publicWsUrl: ""
  # Compatibility shim for legacy multica-web images built before runtime
  # URL rewrites. New images do not need this unprefixed Service.
  compatibility:
    # When true the chart creates an ExternalName Service literally named
    # "backend" for old images that baked REMOTE_API_URL=http://backend:8080.
    # Because that name is unprefixed, only ONE such release can run per
    # namespace. Keep false for current images.
    backendAlias: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Standard Kubernetes scheduling constraints for the frontend Deployment.
  affinity: {}
  tolerations: []

# -----------------------------------------------------------------------------
# Ingress
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: traefik
  annotations: {}
  frontend:
    host: multica.dev.lan
  backend:
    host: api.multica.dev.lan
  # tls:
  #   - hosts: [multica.dev.lan, api.multica.dev.lan]
  #     secretName: multica-tls
