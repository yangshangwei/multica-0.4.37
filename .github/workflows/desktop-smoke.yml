name: Desktop Smoke Build

on:
  workflow_dispatch:
    inputs:
      windows_acceptance:
        description: Run only the Windows x64 candidate lifecycle and managed-runtime acceptance job
        type: boolean
        default: false
      windows_business_acceptance:
        description: Include installed business flows, retained-state upgrade and updater acceptance
        type: boolean
        default: false
      previous_tag:
        description: Same-repository stable release used for the Windows x64 upgrade test
        type: string
        default: v0.5.1
      require_signed:
        description: Fail lifecycle acceptance unless installer and desktop signatures are valid
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    if: inputs.windows_acceptance != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            architectures: --x64 --arm64
          - os: windows-latest
            target: win
            architectures: --x64 --ia32 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rpmbuild (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Deliberately independent from the minimum patch in server/go.mod:
          # CI follows the newest 1.26 patch available to setup-go.
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Desktop installers (${{ matrix.target }})
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/package.mjs --${{ matrix.target }} ${{ matrix.architectures }} --publish never

      - name: Smoke-test Windows x64 and ia32 installers and bundled CLIs
        if: matrix.target == 'win'
        working-directory: apps/desktop
        shell: pwsh
        timeout-minutes: 12
        run: |
          $version = node --input-type=module -e 'import { deriveVersion } from "./scripts/package.mjs"; const version = process.env.MULTICA_DESKTOP_VERSION?.trim() || deriveVersion(); if (!version) process.exit(1); process.stdout.write(version);'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) { throw 'Could not derive the packaged desktop version' }
          ./scripts/smoke-windows-installer.ps1 -ArtifactRoot ./dist -ExpectedVersion $version -ExpectedArch x64 -ReportPath "$env:RUNNER_TEMP/multica-windows-x64-installer-smoke.json"
          ./scripts/smoke-windows-installer.ps1 -ArtifactRoot ./dist -ExpectedVersion $version -ExpectedArch ia32 -ReportPath "$env:RUNNER_TEMP/multica-windows-ia32-installer-smoke.json"

      - name: Upload Windows x64 installer verification
        if: always() && matrix.target == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer-verification
          path: ${{ runner.temp }}/multica-windows-x64-installer-smoke.json
          if-no-files-found: warn

      - name: Upload Windows ia32 installer verification
        if: always() && matrix.target == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: windows-ia32-installer-verification
          path: ${{ runner.temp }}/multica-windows-ia32-installer-smoke.json
          if-no-files-found: warn

      - name: Upload Desktop artifacts (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: apps/desktop/dist
          if-no-files-found: error

  windows-acceptance:
    if: inputs.windows_acceptance == true
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      MULTICA_DESKTOP_VERSION: "0.5.3-rc.${{ github.run_number }}.${{ github.run_attempt }}"
      PREVIOUS_TAG: ${{ inputs.previous_tag }}
      REQUIRE_SIGNED: ${{ inputs.require_signed }}
      BUSINESS_ACCEPTANCE: ${{ inputs.windows_business_acceptance }}
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate acceptance scripts
        shell: pwsh
        run: |
          ./apps/desktop/scripts/accept-windows-installer.test.ps1
          ./apps/desktop/scripts/windows-update-acceptance.test.ps1
          $tokens = $null; $parseErrors = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/scripts/windows-business-server.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          node --test apps/desktop/scripts/windows-update-probe.node-test.mjs apps/desktop/scripts/windows-business-provider.node-test.mjs apps/desktop/scripts/windows-business-proxy.node-test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Update probe tests failed' }
          node --test apps/desktop/scripts/verify-go-test-events.node-test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Go event verifier tests failed' }
      - name: Test Windows desktop ticket publication
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'multica-desktop-lock-tests.json'
          pnpm --filter @multica/desktop exec vitest run src/main/managed-lock.test.ts src/main/managed-lock-publish.test.ts --reporter=json --outputFile $reportPath
          if ($LASTEXITCODE -ne 0) { throw 'Desktop ticket publication tests failed' }
          $result = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($result.numFailedTests -ne 0 -or $result.numPendingTests -ne 0 -or $result.numTotalTests -lt 1) { throw 'Desktop ticket tests failed or skipped' }
      - name: Test native managed identity and transport
        shell: pwsh
        working-directory: server
        run: |
          $names = @('TestManagedIdentityWindowsProfileACL', 'TestManagedIdentityConcurrentPersistence', 'TestManagedLockWindowsReadsDuringDeleteAccess', 'TestManagedLockWindowsPublicationWaitsForReaderAndReleases', 'TestManagedLockWindowsPublicationTimeoutPreservesTicket', 'TestManagedLockWindowsLongPaths', 'TestManagedLockWindowsScanWaitsForDeletePendingTicket', 'TestManagedLockWindowsPersistentScanDenialFailsClosed', 'TestManagedHandoffOriginalBytesAndScope', 'TestManagedTransportUsesScopedCredentialsAndAuthoritativeMaps', 'TestManagedWorkspaceWebSocketsAndRPCRemainIsolated', 'TestManagedConnectionDetachFailsPendingRPCAndPreservesOtherTransport', 'TestManagedHeartbeatHTTPFallbackUsesScopedCredentials', 'TestManagedControlRequestBindsMethodPathBodyTimeAndRejectsReplay', 'TestManagedPIDReservationRejectsLiveAndUnknownPredecessor', 'TestManagedPIDSuccessorSurvivesPredecessorCleanup')
          $pattern = '^(' + ($names -join '|') + ')$'
          $events = Join-Path $env:RUNNER_TEMP 'multica-managed-windows-tests.jsonl'
          go test -json ./internal/daemon -run $pattern -count=1 -timeout=8m 2> "$env:RUNNER_TEMP/multica-managed-windows-tests.stderr.txt" | Tee-Object -FilePath $events
          $goExit = $LASTEXITCODE
          node ../apps/desktop/scripts/verify-go-test-events.mjs $events "$env:RUNNER_TEMP/multica-managed-windows-verification.json" @names
          if ($goExit -ne 0 -or $LASTEXITCODE -ne 0) { throw 'Native managed tests failed or skipped' }
      - name: Stress native concurrent identity creation
        shell: pwsh
        working-directory: server
        run: |
          $events = Join-Path $env:RUNNER_TEMP 'multica-managed-windows-stress.jsonl'
          go test -json ./internal/daemon -run '^TestManagedIdentityConcurrentPersistence$' -count=20 -timeout=4m 2> "$env:RUNNER_TEMP/multica-managed-windows-stress.stderr.txt" | Tee-Object -FilePath $events
          $goExit = $LASTEXITCODE
          node ../apps/desktop/scripts/verify-go-test-events.mjs $events "$env:RUNNER_TEMP/multica-managed-windows-stress-verification.json" TestManagedIdentityConcurrentPersistence
          if ($goExit -ne 0 -or $LASTEXITCODE -ne 0) { throw 'Native concurrent identity stress failed' }
      - name: Prepare isolated Windows business backend
        if: inputs.windows_business_acceptance == true
        shell: pwsh
        run: ./apps/desktop/scripts/windows-business-server.ps1 -StateDirectory "$env:RUNNER_TEMP/multica-business" -RepoRoot "$env:GITHUB_WORKSPACE"
      - name: Package Windows x64 candidate
        working-directory: apps/desktop
        run: node scripts/package.mjs --win --x64 --publish never
      - name: Download feature-capable acceptance baseline
        if: inputs.windows_business_acceptance == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'multica-previous-installer'
          gh run download 36996436086 --repo $env:GITHUB_REPOSITORY --name windows-x64-accepted-candidate --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'Accepted baseline download failed' }
          $path = Join-Path $directory 'multica-desktop-0.5.2-rc.11.1-windows-x64.exe'
          $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'f0b5a5eeded51fa7d1336bd2b46975a0c9ddc6d2292cebba457fd0b6e090fd47') { throw 'Accepted baseline checksum mismatch' }
          'PREVIOUS_VERSION=0.5.2-rc.11.1' >> $env:GITHUB_ENV
      - name: Download and verify previous Windows installer
        if: inputs.windows_business_acceptance != true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:PREVIOUS_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'previous_tag must be a stable version tag' }
          $version = $env:PREVIOUS_TAG.Substring(1)
          "PREVIOUS_VERSION=$version" >> $env:GITHUB_ENV
          $name = "multica-desktop-$version-windows-x64.exe"
          $directory = Join-Path $env:RUNNER_TEMP 'multica-previous-installer'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          gh release download $env:PREVIOUS_TAG --repo $env:GITHUB_REPOSITORY --pattern $name --pattern "$name.sha256" --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'Previous installer download failed' }
          $expected = ((Get-Content -LiteralPath (Join-Path $directory "$name.sha256") -Raw).Trim() -split '\s+')[0]
          if ($expected -notmatch '^[0-9a-fA-F]{64}$') { throw 'Invalid previous installer checksum' }
          $actual = (Get-FileHash -LiteralPath (Join-Path $directory $name) -Algorithm SHA256).Hash
          if ($actual -ine $expected) { throw 'Previous installer checksum mismatch' }
      - name: Accept Windows installer lifecycle
        shell: pwsh
        working-directory: apps/desktop
        timeout-minutes: 20
        run: |
          $version = $env:MULTICA_DESKTOP_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Candidate version unavailable' }
          $candidate = @(Get-ChildItem -LiteralPath ./dist -Recurse -File -Filter "multica-desktop-$version-windows-x64.exe")
          if ($candidate.Count -ne 1) { throw 'Expected exactly one candidate installer' }
          $previousVersion = $env:PREVIOUS_VERSION
          $previous = Join-Path $env:RUNNER_TEMP "multica-previous-installer/multica-desktop-$previousVersion-windows-x64.exe"
          ./scripts/accept-windows-installer.ps1 -InstallerPath $candidate[0].FullName -ExpectedVersion $version -ReportPath "$env:RUNNER_TEMP/multica-windows-lifecycle.json" -PreviousInstallerPath $previous -PreviousVersion $previousVersion -RequireSigned:([bool]::Parse($env:REQUIRE_SIGNED)) -BusinessAcceptance:([bool]::Parse($env:BUSINESS_ACCEPTANCE))
      - name: Accept installed Windows automatic update
        if: inputs.windows_business_acceptance == true
        shell: pwsh
        timeout-minutes: 15
        run: |
          $previous = Join-Path $env:RUNNER_TEMP 'multica-previous-installer/multica-desktop-0.5.2-rc.11.1-windows-x64.exe'
          ./apps/desktop/scripts/windows-update-acceptance.ps1 -PreviousInstallerPath $previous -PreviousVersion '0.5.2-rc.11.1' -CandidateDirectory "$env:GITHUB_WORKSPACE/apps/desktop/dist" -ExpectedVersion $env:MULTICA_DESKTOP_VERSION -StateDirectory "$env:RUNNER_TEMP/multica-update-state" -ReportPath "$env:RUNNER_TEMP/multica-windows-update.json"
      - name: Stop isolated Windows business backend
        if: always() && inputs.windows_business_acceptance == true
        shell: pwsh
        run: ./apps/desktop/scripts/windows-business-server.ps1 -StateDirectory "$env:RUNNER_TEMP/multica-business" -RepoRoot "$env:GITHUB_WORKSPACE" -Stop
      - name: Upload native Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-acceptance-evidence
          path: |
            ${{ runner.temp }}/multica-desktop-lock-tests.json
            ${{ runner.temp }}/multica-managed-windows-tests.jsonl
            ${{ runner.temp }}/multica-managed-windows-tests.stderr.txt
            ${{ runner.temp }}/multica-managed-windows-verification.json
            ${{ runner.temp }}/multica-managed-windows-stress.jsonl
            ${{ runner.temp }}/multica-managed-windows-stress.stderr.txt
            ${{ runner.temp }}/multica-managed-windows-stress-verification.json
            ${{ runner.temp }}/multica-windows-lifecycle.json
            ${{ runner.temp }}/multica-business-server-error.json
            ${{ runner.temp }}/multica-business-baseline.json
            ${{ runner.temp }}/multica-business-verify.json
            ${{ runner.temp }}/multica-windows-update.json
          if-no-files-found: warn
      - name: Upload accepted Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-accepted-candidate
          path: |
            apps/desktop/dist/**/*-windows-x64.exe
            apps/desktop/dist/**/*.blockmap
            apps/desktop/dist/**/latest*.yml
            apps/desktop/dist/**/rc*.yml
          if-no-files-found: error
