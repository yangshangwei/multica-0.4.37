name: Desktop Smoke Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rpmbuild (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Deliberately independent from the minimum patch in server/go.mod:
          # CI follows the newest 1.26 patch available to setup-go.
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Desktop installers (${{ matrix.target }})
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/package.mjs --${{ matrix.target }} --x64 --arm64 --publish never

      - name: Smoke-test Windows x64 installer and bundled CLI
        if: matrix.target == 'win'
        working-directory: apps/desktop
        shell: pwsh
        timeout-minutes: 10
        run: |
          $version = node --input-type=module -e 'import { deriveVersion } from "./scripts/package.mjs"; const version = process.env.MULTICA_DESKTOP_VERSION?.trim() || deriveVersion(); if (!version) process.exit(1); process.stdout.write(version);'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) { throw 'Could not derive the packaged desktop version' }
          ./scripts/smoke-windows-installer.ps1 -ArtifactRoot ./dist -ExpectedVersion $version -ReportPath "$env:RUNNER_TEMP/multica-windows-x64-installer-smoke.json"

      - name: Upload Windows installer verification
        if: always() && matrix.target == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer-verification
          path: ${{ runner.temp }}/multica-windows-x64-installer-smoke.json
          if-no-files-found: warn

      - name: Upload Desktop artifacts (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: apps/desktop/dist
          if-no-files-found: error
