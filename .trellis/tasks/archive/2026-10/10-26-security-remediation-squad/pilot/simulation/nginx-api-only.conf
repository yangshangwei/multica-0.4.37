worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    access_log off;
    resolver 127.0.0.11 ipv6=off valid=30s;
    server_tokens off;
    client_body_temp_path /tmp/simulation-body;
    proxy_temp_path /tmp/simulation-proxy;
    map $http_upgrade $simulation_connection {
        default upgrade;
        '' close;
    }
    server {
        listen 8080;
        server_name _;
        set $simulation_api_host host.docker.internal;
        client_max_body_size 16m;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_intercept_errors on;
        proxy_hide_header Location;
        error_page 301 302 303 307 308 = @blocked_redirect;
        if ($request_method = CONNECT) { return 405; }
        location = /api { return 403; }
        location = /health {
            limit_except GET { deny all; }
            proxy_pass http://$simulation_api_host:18572/health;
            proxy_set_header Host localhost:18572;
            proxy_set_header Connection close;
            proxy_set_header Authorization $http_authorization;
        }
        location /api/ {
            proxy_pass http://$simulation_api_host:18572;
            proxy_set_header Host localhost:18572;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $simulation_connection;
            proxy_set_header Authorization $http_authorization;
        }
        location @blocked_redirect { return 502; }
        location / { return 403; }
    }
}
