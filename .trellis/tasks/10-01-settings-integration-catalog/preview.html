  <style>

    main{flex:1;min-width:0}.content{max-width:1060px;margin:0 auto;padding:42px 40px 64px}.page-heading{margin-bottom:34px}h1{font-size:24px;line-height:32px;letter-spacing:-.5px;font-weight:600}.subtitle{color:var(--muted);font-size:14px;margin-top:7px;line-height:22px}.section{margin-top:30px}.section:first-of-type{margin-top:0}.section-heading{margin-bottom:13px}.section-heading h2{font-size:14px;font-weight:600}.section-heading p{font-size:12px;color:var(--muted);margin-top:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.integration{min-width:0;min-height:92px;padding:18px;display:flex;align-items:center;gap:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface);text-align:left}.integration:hover{background:var(--hover);border-color:#cbcbd1}.mark{width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.mark svg{width:32px;height:32px}.mark[data-brand=vcs]{color:#e66031}.card-copy{flex:1;min-width:0}.card-title-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.card-name{font-size:15px;line-height:22px;font-weight:600}.card-description{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:19px;overflow-wrap:anywhere}.chevron{width:16px;height:16px;color:#87858e}.badge{font-size:11px;line-height:18px;padding:1px 6px;border-radius:4px;color:var(--green);background:#edf6f0;white-space:nowrap;font-weight:500}.badge.neutral{color:var(--muted);background:#f2f2f4}.planned{background:transparent}.planned:hover{background:transparent;border-color:var(--border)}.planned .card-name{font-weight:500}.footnote{font-size:12px;color:var(--muted);margin-top:24px;display:flex;align-items:flex-start;gap:7px}.footnote svg{width:15px;height:15px;margin-top:2px}
    .detail.content{max-width:832px}.back{min-height:32px;display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin-bottom:28px}.back svg{width:16px;height:16px}.back:hover{color:var(--text)}.detail-heading{display:flex;align-items:center;gap:14px}.detail-heading .mark,.detail-heading .mark svg{width:36px;height:36px}.detail-heading h1{font-size:24px}.detail-intro{margin-top:10px;max-width:640px;color:var(--muted);line-height:22px}.detail .page-heading{margin-bottom:28px}.panel{border:1px solid var(--border);border-radius:10px;background:var(--surface)}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px 20px}.setting-copy{min-width:0;flex:1}.setting-label{font-size:14px;font-weight:500}.setting-description{font-size:12px;line-height:20px;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}.setting-description code{font-size:11px;overflow-wrap:anywhere;background:var(--hover);padding:2px 4px;border-radius:3px}.switch{flex-shrink:0;width:36px;height:24px;border:0;border-radius:20px;background:#bbbbc3;padding:3px;display:flex;align-items:center;justify-content:flex-start}.switch[aria-checked=true]{background:var(--text);justify-content:flex-end}.switch span{width:18px;height:18px;border-radius:50%;background:#fff}.switch:disabled{opacity:.45}.feature-row{align-items:flex-start}.feature-row+.feature-row{border-top:1px solid var(--border)}.feature-icon{display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--hover);width:34px;height:34px;border-radius:6px;color:var(--muted);flex-shrink:0}.feature-icon svg{width:17px;height:17px}.feature-left{display:flex;align-items:flex-start;gap:12px;min-width:0}.feature-row .switch{margin-top:4px}.action{border:1px solid var(--border);border-radius:6px;padding:6px 11px;font-size:12px;background:var(--surface);white-space:nowrap;min-height:32px}.action:hover{background:var(--hover)}.action.primary{color:#fff;background:var(--text);border-color:var(--text)}.connection-brand{display:flex;align-items:flex-start;gap:12px}.connection-brand>.mark,.connection-brand>.mark svg{width:24px;height:24px}.statusline{display:flex;align-items:center;gap:6px}.dot{height:6px;width:6px;border-radius:50%;background:var(--green)}.detail-section{margin-top:26px}.detail-section h2{font-size:14px;font-weight:600;margin-bottom:12px}.generic-info{margin-top:25px;padding:22px}.generic-info p{margin-top:10px;color:var(--muted);line-height:24px}.generic-info ul{padding-left:18px;line-height:28px}.demo-hint{margin-top:20px;color:var(--muted);font-size:12px}dialog{padding:24px;border:1px solid var(--border);border-radius:12px;max-width:420px;width:calc(100% - 40px);color:var(--text);background:var(--surface)}dialog::backdrop{background:rgb(20 20 25 / .22)}dialog h2{font-size:18px}dialog p{color:var(--muted);margin-top:12px;font-size:13px;line-height:22px}.dialog-actions{display:flex;justify-content:flex-end;margin-top:24px;gap:8px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 18px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:13px;max-width:calc(100vw - 32px);box-shadow:0 6px 20px #0000000c}
    @media(min-width:1500px){.content{padding-top:48px}}
    @media(max-width:1090px){.content{padding:32px 24px}.grid{gap:10px}.integration{padding:16px;gap:12px}.card-title-row{gap:5px}.mark,.mark svg{width:28px;height:28px}}
    @media(max-width:800px){aside{display:none}.mobile-context{display:block;border-bottom:1px solid var(--border);font-size:13px;padding:13px 20px;font-weight:500}.preview-bar{padding:10px 16px;align-items:flex-start;flex-wrap:wrap;gap:8px}.preview-note{display:none}.content{padding:28px 20px 40px}.grid{grid-template-columns:1fr}.integration{min-height:88px}.page-heading{margin-bottom:28px}.setting-row{padding:16px;gap:14px}.setting-row.connection{align-items:flex-start;flex-wrap:wrap}.detail-heading h1{font-size:20px}.feature-left{gap:10px}.feature-icon{display:none}.preview-bar select{max-width:170px}.back{margin-bottom:22px;min-height:44px}.action,.preview-bar select{min-height:44px}.switch{width:44px;height:28px;padding:4px}.switch span{width:20px;height:20px}}
    @media(prefers-reduced-motion:no-preference){.integration,.action{transition:background-color .12s,border-color .12s}}

<body>
  <!-- Design prototype only. Connection data is synthetic; no API requests or persistent settings writes. -->
  <div class="preview-bar"><div><strong>Multica · 集成改造预览</strong><span class="preview-note">示例连接状态 · 点击卡片查看详情</span></div><label>GitHub 示例<select id="demo-state"><option value="connected">已连接</option><option value="disconnected">未连接</option><option value="disabled">已连接 · 功能关闭</option></select></label></div>
  <div class="layout">
    <aside aria-label="设置导航示意">
      <div class="settings-title"><span data-icon="settings"></span>设置</div>
      <div class="nav-group"><p class="nav-caption">账号</p><span class="nav-item static"><span data-icon="user"></span>个人资料</span><span class="nav-item static"><span data-icon="sliders"></span>偏好设置</span><span class="nav-item static"><span data-icon="bell"></span>通知</span><span class="nav-item static"><span data-icon="keyboard"></span>快捷键</span><span class="nav-item static"><span data-icon="key"></span>API 令牌</span></div>
      <div class="nav-group"><p class="nav-caption">工作空间</p><span class="nav-item static"><span data-icon="settings"></span>通用</span><span class="nav-item static"><span data-icon="users"></span>成员</span><span class="nav-item static"><span data-icon="tag"></span>标签</span></div>
      <div class="nav-group"><p class="nav-caption">任务</p><span class="nav-item static"><span data-icon="circle"></span>任务状态</span><span class="nav-item static"><span data-icon="sliders"></span>属性</span><span class="nav-item static"><span data-icon="bolt"></span>快捷操作</span></div>
      <div class="nav-group"><p class="nav-caption">连接</p><span class="nav-item static"><span data-icon="folder"></span>代码仓库</span><a class="nav-item active" href="#catalog" aria-current="page"><span data-icon="plug"></span>集成</a><span class="nav-item static"><span data-icon="cable"></span>MCP</span></div>
    </aside>
    <main><div class="mobile-context">设置 / 集成</div><div id="screen"></div></main>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="confirm" aria-labelledby="confirm-title"><h2 id="confirm-title">断开 GitHub App</h2><p>Multica 将不再接收该安装的 webhook。已有的 PR 镜像与关联会保留，再次连接即可恢复同步。</p><p>此处仅演示交互，不会更改真实连接。</p><div class="dialog-actions"><button class="action" id="cancel-disconnect" autofocus>取消</button><button class="action primary" id="confirm-disconnect">断开</button></div></dialog>
  <!--
Third-party artwork notices (retained in this standalone artifact):
Source: packages/views/settings/components/github-mark.tsx
lucide-react v1.x dropped brand marks (including Github). Inline SVG of
the official GitHub octocat mark so the GitHub settings tab keeps a
recognizable icon in the sidebar and section headers.
  -->
  <script>
    // Existing brand SVGs are inserted from the repository when generating this artifact.
    const brands = {"github": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"currentColor\"> <path d=\"M12 .5C5.6.5.5 5.6.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.6v-2.2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2.9-.3 1.9-.4 2.9-.4s2 .1 2.9.4c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.1.7.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.6 18.4.5 12 .5z\" /> </svg>"};
    const paths = {chevron:'<path d="m9 5 7 7-7 7"/>',back:'<path d="m12 5-7 7 7 7M5 12h15"/>',settings:'<path d="m9 3-.6 2-2 .9-2-.5-2 3.4 1.5 1.5v2.4L2.4 14l2 3.4 2-.5 2 .9.6 2h4l.6-2 2-.9 2 .5 2-3.4-1.5-1.3v-2.4L20.6 8l-2-3.4-2 .5-2-.9L14 3Z"/><circle cx="11.5" cy="11.5" r="3"/>',user:'<circle cx="12" cy="7" r="4"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/>',users:'<circle cx="9" cy="7" r="3"/><path d="M3 21v-4a6 6 0 0 1 12 0v4M16 4a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5v2"/>',sliders:'<path d="M4 7h8m4 0h4M4 17h3m4 0h9"/><circle cx="14" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 8-3 8-3 9h18c0-1-3-1-3-9M10 21h4"/>',keyboard:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.1M10 9h.1M14 9h.1M18 9h.1M6 12h.1M10 12h.1M14 12h.1M18 12h.1M7 15h10"/>',key:'<circle cx="7" cy="8" r="5"/><path d="m11 12 9 9m-2-2 3-3m-6 0 3-3"/>',tag:'<path d="M3 3h8l10 10-8 8L3 11Z"/><circle cx="7.5" cy="7.5" r="1"/>',circle:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>',bolt:'<path d="m13 2-9 12h7l-1 8 10-12h-8Z"/>',folder:'<path d="M3 19V5a2 2 0 0 1 2-2h5l3 3h6a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',plug:'<path d="m8 3 4 4m4-4-4 4m-7 3 5-5 9 9-5 5a5 5 0 0 1-7-7l-2-2ZM4 20l4-4"/>',cable:'<path d="M7 3v5m-3 0h6v5H4ZM17 21v-5m-3 0h6v-5h-6ZM7 13v3a5 5 0 0 0 5 5M17 11V8a5 5 0 0 0-5-5"/>',branch:'<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="6" r="2"/><path d="M6 7v10m0-5h5a7 7 0 0 0 7-4"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>',panel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>',commit:'<circle cx="12" cy="12" r="4"/><path d="M2 12h6m8 0h6"/>',link:'<path d="m10 13 4-4m-6 6-2 2a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0m2 2 2-2a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0" transform="translate(2 1) scale(.85)"/>',external:'<path d="M14 3h7v7m0-7L11 13M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/>'};
    function icon(name,cls=''){return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.plug}</svg>`}
    function mark(id){return `<span class="mark" data-brand="${id}">${brands[id]||icon(id==='vcs'?'branch':'plug')}</span>`}
    document.querySelectorAll('[data-icon]').forEach(n=>n.innerHTML=icon(n.dataset.icon));
    const providers=[
      {id:'github',name:'GitHub',description:'关联 Pull Request，自动更新任务状态。',group:'code'},
      {id:'vcs',name:'自托管 Git',description:'连接 GitLab、Gitea 或 Forgejo 实例。',group:'code'},
      {id:'fuxin',name:'孚信',description:'团队沟通与协作。',group:'chat',planned:true},
      {id:'ones',name:'ONES',description:'需求、缺陷与任务的同步。',group:'future'},
      {id:'plane',name:'Plane',description:'任务与项目进度的同步。',group:'future'},
      {id:'kaneo',name:'Kaneo',description:'任务与看板的同步。',group:'future'}
    ];
    let connected=true,enabled=true;
    const features=[{id:'pr',icon:'panel',label:'Pull Request 侧栏',description:'在任务详情侧栏中展示关联的 Pull Request。',on:true},{id:'coauthor',icon:'commit',label:'Co-authored-by trailer',description:'在智能体提交的 commit 中追加 <code>Co-authored-by: multica-agent &lt;github@multica.ai&gt;</code>。',on:true},{id:'autolink',icon:'link',label:'任务 ↔ PR 自动关联',description:'根据 PR 标题、正文和分支名匹配任务编号并自动建立链接。',on:true}];
    function badge(text,neutral=false){return `<span class="badge${neutral?' neutral':''}">${text}</span>`}
    function card(p){const future=p.group==='future'||p.planned===true;let status='';if(p.id==='github')status=badge(connected?'已连接':'未连接',!connected);else if(future)status=badge('待规划',true);return `<${future?'div':'a'} ${future?'aria-disabled="true"':`href="#${p.id}"`} class="integration${future?' planned':''}">${mark(p.id)}<span class="card-copy"><span class="card-title-row"><span class="card-name">${p.name}</span>${status}</span><span class="card-description">${p.description}${p.id==='github'&&!enabled?' 功能已关闭。':''}</span></span>${future?'':icon('chevron','chevron')}</${future?'div':'a'}>`}
    function section(id,title,description,extra=''){return `<section class="section ${extra}"><div class="section-heading"><h2>${title}</h2><p>${description}</p></div><div class="grid">${providers.filter(p=>p.group===id).map(card).join('')}</div></section>`}
    function catalog(){return `<div class="content"><header class="page-heading"><h1 tabindex="-1">集成</h1><p class="subtitle">连接团队使用的工具，让任务、代码与沟通协同工作。</p></header>${section('code','代码托管','连接代码平台，将 Pull Request 与任务关联。')}${section('future','任务管理','后续优先接入方向，具体支持范围与时间待确定。')}${section('chat','沟通与协作','连接团队使用的沟通工具。')}<p class="footnote">${icon('info')}集成项按当前部署开放。</p></div>`}
    function toggle(id,on,label,disabled=false){return `<button class="switch" role="switch" aria-label="${label}" aria-checked="${on}" data-toggle="${id}" ${disabled?'disabled':''}><span></span></button>`}
    function detailHeader(p){return `<a href="#catalog" class="back">${icon('back')}全部集成</a><header class="page-heading"><div class="detail-heading">${mark(p.id)}<h1 tabindex="-1">${p.name}</h1>${p.id==='github'?badge(connected?'已连接':'未连接',!connected):''}</div><p class="detail-intro">${p.id==='github'?'连接 GitHub App，管理 Pull Request 关联与智能体提交设置。':p.description}</p></header>`}
    function github(){return `<div class="content detail">${detailHeader(providers[0])}<div class="panel"><div class="setting-row"><div class="setting-copy"><div class="setting-label">启用 GitHub 功能</div><p class="setting-description">${enabled?'控制 PR 侧栏、提交署名与自动关联；关闭后保留已有数据。':'GitHub 功能已关闭。已有数据与连接会保留，可随时重新启用。'}</p></div>${toggle('master',enabled,'启用 GitHub 功能')}</div></div><section class="detail-section"><h2>连接</h2><div class="panel"><div class="setting-row connection"><div class="connection-brand">${mark('github')}<div class="setting-copy"><p class="setting-label">GitHub App</p>${connected?'<p class="setting-description statusline"><span class="dot"></span>已连接到 multica-demo</p><p class="setting-description">由示例管理员连接</p>':'<p class="setting-description">自动关联包含任务编号的 Pull Request，合并后更新任务状态。</p>'}</div></div><button id="connection-action" class="action ${connected?'':'primary'}">${connected?'断开':'连接 GitHub'}</button></div></div></section><section class="detail-section"><h2>功能</h2><div class="panel">${features.map(f=>`<div class="setting-row feature-row"><div class="feature-left"><span class="feature-icon">${icon(f.icon)}</span><div class="setting-copy"><p class="setting-label">${f.label}</p><p class="setting-description">${f.description}</p></div></div>${toggle(f.id,enabled&&f.on,f.label,!enabled)}</div>`).join('')}</div></section><section class="detail-section"><h2>代码仓库</h2><div class="panel"><div class="setting-row"><p class="setting-label">仓库 URL 在“代码仓库”中管理</p><button class="action" id="repository-action">前往管理 ↗</button></div></div></section><p class="demo-hint">设计预览 · 沿用当前 GitHub 配置功能，连接与开关仅为交互示意。</p></div>`}
    function generic(p){const scope='工作空间连接',items=['选择 Forgejo、Gitea 或 GitLab','配置实例地址与访问令牌','管理连接、仓库与 Pull Request 镜像'];return `<div class="content detail">${detailHeader(p)}<div class="panel generic-info"><h2 style="font-size:16px">${scope}</h2><ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul><p>正式改造时，此处承载现有的 ${p.name} 配置页面。</p></div><p class="demo-hint">此页展示内容组织方式；本次可操作预览集中在 GitHub。</p></div>`}
    let toastTimer;function notify(text){const t=document.getElementById('toast');t.textContent=text;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3200)}
    let currentProviderId=null;
    function render(focus=false){const id=location.hash.slice(1),p=providers.find(x=>x.id===id&&x.group!=='future'&&x.planned!==true);document.getElementById('screen').innerHTML=p?(p.id==='github'?github():generic(p)):catalog();if(focus){const target=!p&&currentProviderId?document.querySelector(`#screen a[href="#${currentProviderId}"]`):document.querySelector('h1');target?.focus({preventScroll:true});if(p)window.scrollTo(0,0);else target?.scrollIntoView({block:'nearest'})}currentProviderId=p?.id||null;document.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.toggle;if(id==='master'){enabled=!enabled;document.getElementById('demo-state').value=connected?(enabled?'connected':'disabled'):'disconnected';render();document.querySelector('[data-toggle="master"]').focus({preventScroll:true})}else{const f=features.find(f=>f.id===id);f.on=!f.on;b.setAttribute('aria-checked',String(f.on))}notify('已更新预览状态，未保存到实际工作空间')}));document.getElementById('connection-action')?.addEventListener('click',()=>connected?document.getElementById('confirm').showModal():notify('正式页面将在此打开 GitHub 授权；可用顶部菜单切换连接示例'));document.getElementById('repository-action')?.addEventListener('click',()=>notify('正式页面将跳转至“设置 → 代码仓库”'))}
    document.getElementById('demo-state').addEventListener('change',e=>{connected=e.target.value!=='disconnected';enabled=e.target.value!=='disabled';render()});document.getElementById('cancel-disconnect').addEventListener('click',()=>document.getElementById('confirm').close());document.getElementById('confirm-disconnect').addEventListener('click',()=>{connected=false;document.getElementById('confirm').close();document.getElementById('demo-state').value='disconnected';render();document.getElementById('connection-action')?.focus({preventScroll:true});notify('已在预览中断开，真实连接未更改')});window.addEventListener('hashchange',()=>render(true));render();
  </script>
</body>
</html>
