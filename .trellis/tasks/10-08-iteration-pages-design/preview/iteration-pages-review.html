    light-dark(rgb(255 255 255), rgb(24 24 24))

h2,
h3,
h4,
h5,
h6,

}

b,

}

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;

.card {

  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  top: 0;
  left: 0;

  pointer-events: none;

  align-items: center;

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);

  transform: translate(2px, -50%);

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {

  box-shadow: 0 0 0 2px var(--ring);

.form-range {
  appearance: none;

  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;

  border: 0;

      color-mix(in srgb, var(--foreground) 7%, transparent),

.form-range::-webkit-slider-runnable-track {
  height: 28px;

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);

}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

svg.lucide {

  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
(() =&gt; {

{id:&#x27;p3&#x27;,name:&#x27;迭代 3&#x27;,start:&#x27;2026-11-30&#x27;,end:&#x27;2026-12-13&#x27;,status:&#x27;planned&#x27;,description:&#x27;打磨体验，整理年底交付。&#x27;,tasks:[]},

periods[2].tasks=taskNames.map((name,i)=&gt;({id:&#x27;MUL-&#x27;+(121+i),name,status:i&lt;8?&#x27;done&#x27;:i&lt;11?&#x27;active&#x27;:i&lt;13?&#x27;todo&#x27;:&#x27;cancelled&#x27;,project:i%3===0?&#x27;团队协作&#x27;:&#x27;迭代管理&#x27;,person:i%2===0?&#x27;林然&#x27;:&#x27;小周&#x27;}));
periods[3].tasks=taskNames.slice(0,11).map((name,i)=&gt;({id:&#x27;MUL-&#x27;+(101+i),name,status:i&lt;9?&#x27;done&#x27;:&#x27;todo&#x27;,project:&#x27;团队协作&#x27;,person:&#x27;林然&#x27;}));

const chosen=()=&gt;periods.find(p=&gt;p.id===selectedId)||periods[2];
const countStats=p=&gt;p.id===&#x27;p1&#x27;?{original:12,current:p.tasks.length,effective:p.tasks.filter(t=&gt;t.status!==&#x27;cancelled&#x27;).length,completed:p.tasks.filter(t=&gt;t.status===&#x27;done&#x27;).length,remaining:p.tasks.filter(t=&gt;![&#x27;done&#x27;,&#x27;cancelled&#x27;].includes(t.status)).length,originalDone:7,cancelled:p.tasks.filter(t=&gt;t.status===&#x27;cancelled&#x27;).length}:p.id===&#x27;h1&#x27;?{original:10,current:11,effective:11,completed:9,remaining:2,originalDone:9,cancelled:0}:{original:p.status===&#x27;planned&#x27;?null:p.tasks.length,current:p.tasks.length,effective:p.tasks.filter(t=&gt;t.status!==&#x27;cancelled&#x27;).length,completed:p.tasks.filter(t=&gt;t.status===&#x27;done&#x27;).length,remaining:p.tasks.filter(t=&gt;![&#x27;done&#x27;,&#x27;cancelled&#x27;].includes(t.status)).length,originalDone:0,cancelled:0};
const series=p=&gt;p.id===&#x27;h1&#x27;?{effective:[10,10,10,10,11,11,11,11,11,11,11,11,11,11],done:[0,1,1,2,3,3,4,5,5,6,7,7,8,9],original:10}:{effective:[12,12,12,14,14,13,13,countStats(p).effective],done:[0,1,3,3,4,6,7,countStats(p).completed],original:12};
function chartMarkup(p){const s=countStats(p);return `&lt;div class=&quot;ip-chart-layout&quot;&gt;&lt;div class=&quot;ip-plot&quot;&gt;&lt;svg class=&quot;ip-chart&quot; data-chart-period=&quot;${p.id}&quot; role=&quot;img&quot; aria-label=&quot;按任务数统计的有效范围与完成趋势，原始承诺以虚线表示&quot;&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;ip-legend&quot;&gt;&lt;div class=&quot;ip-legend-row&quot;&gt;&lt;span class=&quot;ip-swatch&quot;&gt;&lt;/span&gt;有效范围&lt;strong&gt;${s.effective} 条&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;ip-legend-row&quot;&gt;&lt;span class=&quot;ip-swatch ip-done&quot;&gt;&lt;/span&gt;已完成&lt;strong&gt;${s.completed} 条&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;ip-rate&quot;&gt;完成率 ${s.effective?(s.completed/s.effective*100).toFixed(1)+&#x27;%&#x27;:&#x27;不适用&#x27;}&lt;/div&gt;&lt;div class=&quot;ip-legend-row&quot;&gt;&lt;span class=&quot;ip-swatch ip-base&quot;&gt;&lt;/span&gt;原始承诺&lt;strong&gt;${s.original} 条&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;}
function drawCharts(){
root.querySelectorAll(&#x27;svg[data-chart-period]&#x27;).forEach(svg=&gt;{
 const p=periods.find(p=&gt;p.id===svg.dataset.chartPeriod);if(!p)return;
 const values=series(p),w=Math.max(svg.getBoundingClientRect().width,180),h=svg.getBoundingClientRect().height||235;
 const totalDays=[&#x27;completed&#x27;,&#x27;cancelled&#x27;].includes(p.status)?values.effective.length-1:13;
 const left=28,right=8,top=27,bottom=29,plotW=w-left-right,plotH=h-top-bottom,max=Math.max(16,...values.effective);
 const x=i=&gt;left+i/totalDays*plotW,y=v=&gt;top+plotH-v/max*plotH;
 const points=arr=&gt;arr.map((v,i)=&gt;`${x(i)},${y(v)}`).join(&#x27; &#x27;);
 const id=&#x27;ip-hatch-&#x27;+p.id+&#x27;-&#x27;+(page===&#x27;overview&#x27;?&#x27;overview&#x27;:detailTab);
 const endKnown=values.effective.length-1,nowX=x(endKnown);
 svg.setAttribute(&#x27;viewBox&#x27;,`0 0 ${w} ${h}`);
 const dateAt=i=&gt;{const [yr,mo,day]=p.start.split(&#x27;-&#x27;).map(Number);const d=new Date(Date.UTC(yr,mo-1,day+i));return(d.getUTCMonth()+1)+&#x27;月&#x27;+d.getUTCDate()+&#x27;日&#x27;};
 svg.innerHTML=`&lt;defs&gt;&lt;pattern id=&quot;${id}&quot; width=&quot;8&quot; height=&quot;8&quot; patternUnits=&quot;userSpaceOnUse&quot;&gt;&lt;path d=&quot;M0 8 L8 0&quot; stroke=&quot;var(--ip-line)&quot; stroke-width=&quot;1&quot;/&gt;&lt;/pattern&gt;&lt;/defs&gt;&lt;text x=&quot;0&quot; y=&quot;12&quot;&gt;任务数&lt;/text&gt;${endKnown&lt;totalDays?`&lt;rect x=&quot;${nowX}&quot; y=&quot;${top}&quot; width=&quot;${x(totalDays)-nowX}&quot; height=&quot;${plotH}&quot; fill=&quot;url(#${id})&quot;/&gt;&lt;text x=&quot;${nowX+(x(totalDays)-nowX)/2}&quot; y=&quot;${top+16}&quot; text-anchor=&quot;middle&quot;&gt;尚未发生&lt;/text&gt;`:&#x27;&#x27;}${[0,8,16].map(n=&gt;`&lt;line x1=&quot;${left}&quot; x2=&quot;${w-right}&quot; y1=&quot;${y(n)}&quot; y2=&quot;${y(n)}&quot; stroke=&quot;var(--ip-line)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;${left-8}&quot; y=&quot;${y(n)+4}&quot; text-anchor=&quot;end&quot;&gt;${n}&lt;/text&gt;`).join(&#x27;&#x27;)}&lt;line x1=&quot;${x(0)}&quot; x2=&quot;${x(totalDays)}&quot; y1=&quot;${y(values.original)}&quot; y2=&quot;${y(values.original)}&quot; stroke=&quot;var(--ip-original)&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;4 4&quot;/&gt;&lt;polyline points=&quot;${points(values.effective)}&quot; fill=&quot;none&quot; stroke=&quot;var(--ip-scope)&quot; stroke-width=&quot;2&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;polyline points=&quot;${points(values.done)}&quot; fill=&quot;none&quot; stroke=&quot;var(--ip-violet)&quot; stroke-width=&quot;2.5&quot; stroke-linejoin=&quot;round&quot;/&gt;${endKnown&lt;totalDays?`&lt;line x1=&quot;${nowX}&quot; x2=&quot;${nowX}&quot; y1=&quot;${top}&quot; y2=&quot;${y(0)}&quot; stroke=&quot;var(--ip-original)&quot; stroke-width=&quot;1&quot;/&gt;`:&#x27;&#x27;}&lt;circle cx=&quot;${nowX}&quot; cy=&quot;${y(values.done[endKnown])}&quot; r=&quot;3.5&quot; fill=&quot;var(--ip-violet)&quot; stroke=&quot;var(--ip-bg)&quot; stroke-width=&quot;2&quot;/&gt;${[0,Math.round(totalDays/2),totalDays].map((d,i)=&gt;`&lt;text x=&quot;${x(d)}&quot; y=&quot;${h-7}&quot; text-anchor=&quot;${i===0?&#x27;start&#x27;:i===2?&#x27;end&#x27;:&#x27;middle&#x27;}&quot;&gt;${dateAt(d)}&lt;/text&gt;`).join(&#x27;&#x27;)}`;
});}
function bindCharts(){if(observer)observer.disconnect();drawCharts();observer=new ResizeObserver(drawCharts);root.querySelectorAll(&#x27;.ip-plot&#x27;).forEach(el=&gt;observer.observe(el));}

function overview(){
const upcoming=periods.filter(p=&gt;p.status===&#x27;planned&#x27;).sort((a,b)=&gt;a.start.localeCompare(b.start))[0]?.id;
const all=periods.filter(p=&gt;listTab===&#x27;open&#x27;?[&#x27;planned&#x27;,&#x27;active&#x27;].includes(p.status):[&#x27;completed&#x27;,&#x27;cancelled&#x27;].includes(p.status)).sort((a,b)=&gt;b.start.localeCompare(a.start));
const shown=all.filter(p=&gt;(!query||p.name.includes(query))&amp;&amp;(!statusFilter||p.status===statusFilter));
let rows=&#x27;&#x27;;
shown.forEach((p,i)=&gt;{
const next=shown[i+1];const isCurrent=p.status===&#x27;active&#x27;;
rows+=`&lt;article class=&quot;ip-period ${isCurrent?&#x27;ip-current&#x27;:&#x27;&#x27;}&quot;&gt;&lt;div class=&quot;ip-date&quot;&gt;${shortDate(p.start).replace(&#x27;月&#x27;,&#x27;月&lt;br&gt;&#x27;)}&lt;/div&gt;&lt;div class=&quot;ip-period-body&quot;&gt;&lt;div class=&quot;ip-period-head&quot;&gt;&lt;button class=&quot;ip-period-name&quot; type=&quot;button&quot; data-period=&quot;${p.id}&quot;&gt;&lt;span class=&quot;ip-state-icon ${p.status===&#x27;planned&#x27;?&#x27;ip-dashed&#x27;:&#x27;&#x27;}&quot;&gt;${icon(p.status===&#x27;completed&#x27;?&#x27;check&#x27;:&#x27;play&#x27;)}&lt;/span&gt;&lt;span&gt;&lt;span class=&quot;ip-name&quot;&gt;${esc(p.name)}&lt;/span&gt;&lt;span class=&quot;ip-subline&quot;&gt;${dateSpan(p)}&lt;/span&gt;&lt;/span&gt;&lt;/button&gt;&lt;div class=&quot;ip-period-meta&quot;&gt;&lt;span class=&quot;ip-badge ${isCurrent?&#x27;ip-live&#x27;:&#x27;&#x27;}&quot;&gt;${isCurrent?&#x27;当前&#x27;:p.id===upcoming?&#x27;即将开始&#x27;:labelStatus(p.status)}&lt;/span&gt;${isCurrent?`&lt;span class=&quot;ip-small&quot;&gt;当前范围 ${countStats(p).current} 条&lt;/span&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;${isCurrent?`${chartMarkup(p)}&lt;div class=&quot;ip-chart-foot&quot;&gt;&lt;span&gt;含 ${countStats(p).cancelled} 条已取消任务，有效范围不计取消任务&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;ip-button ip-quiet&quot; data-period=&quot;${p.id}&quot;&gt;查看迭代 ${icon(&#x27;arrow-right&#x27;)}&lt;/button&gt;&lt;/div&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;/article&gt;`;
if(next&amp;&amp;!query&amp;&amp;!statusFilter&amp;&amp;listTab===&#x27;open&#x27;){
 const days=Math.round((Date.parse(p.start+&#x27;T00:00:00Z&#x27;)-Date.parse(next.end+&#x27;T00:00:00Z&#x27;))/86400000)-1;
 if(days&gt;0)rows+=`&lt;div class=&quot;ip-gap&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;div class=&quot;ip-gap-body&quot;&gt;${icon(&#x27;pause-circle&#x27;)}&lt;span&gt;${days} 天未安排迭代&lt;/span&gt;&lt;span&gt;日期之间的空档&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`;
}
});

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;
