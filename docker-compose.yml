name: multica

services:
  postgres:
    image: pgvector/pgvector:pg17
    # Concurrent PostgreSQL parallel queries need more than Docker's 64 MiB default.
    shm_size: 256mb
    environment:
      POSTGRES_DB: multica
      POSTGRES_USER: ${POSTGRES_USER:-multica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multica}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
